<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spot It! Vocabulary Challenge</title>
<style>
/* ============ БАЗОВЫЕ СТИЛИ ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --bg-1: #667eea;
  --bg-2: #764ba2;
  --card-bg: #ffffff;
  --card-border: #e5e7eb;
  --card-shadow: 0 20px 60px rgba(0,0,0,0.15);
  --text: #1f2937;
  --text-light: #6b7280;
  --radius: 20px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  font-size: 16px;
  color: var(--text);
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body.bg-image::before {
  content: ''; position: fixed; inset: 0;
  background: var(--bg-overlay);
  z-index: 0;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  outline: none;
  transition: var(--transition);
  font-size: 1rem;
  min-height: 44px;
  touch-action: manipulation;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }

input, select, textarea {
  font-family: inherit;
  font-size: 1rem;
  padding: 10px 14px;
  border: 2px solid var(--card-border);
  border-radius: 10px;
  outline: none;
  background: white;
  transition: var(--transition);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

/* ============ ЭКРАНЫ ============ */
.screen {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 1;
}
.screen.active { display: flex; }

/* ============ ГЛАВНОЕ МЕНЮ ============ */
#menuScreen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 20px;
  z-index: 2;
}
.menu-title {
  font-size: clamp(2rem, 7vw, 4.5rem);
  font-weight: 800;
  color: white;
  text-align: center;
  text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  animation: titleFloat 3s ease-in-out infinite;
  letter-spacing: -0.02em;
}
.menu-subtitle {
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: rgba(255,255,255,0.9);
  text-align: center;
  margin-bottom: 30px;
  font-weight: 500;
}
@keyframes titleFloat {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-10px) rotate(1deg); }
}
.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  max-width: 380px;
}
.menu-btn {
  padding: 18px 30px;
  font-size: 1.15rem;
  font-weight: 700;
  border-radius: 16px;
  background: white;
  color: var(--primary-dark);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.menu-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.menu-btn:active { transform: translateY(-1px); }
.menu-btn.primary {
  background: linear-gradient(135deg, var(--accent), #f97316);
  color: white;
}
.menu-btn .icon { font-size: 1.5rem; }

/* ============ ИГРОВОЙ ЭКРАН ============ */
#gameScreen {
  flex-direction: column;
  z-index: 2;
}
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: white;
  gap: 10px;
  flex-wrap: wrap;
}
.hud-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.2);
  padding: 8px 16px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 1rem;
  min-width: 80px;
  justify-content: center;
}
.hud-item .icon { font-size: 1.3rem; }
.hud-item.lives { color: #ff6b9d; }
.hud-item.team-score { min-width: 120px; }
.hud-item.team-left { border: 2px solid rgba(96,165,250,.75); }
.hud-item.team-right { border: 2px solid rgba(248,113,113,.75); }
.hud-item.streak { color: #fbbf24; }
.hud-btn {
  background: rgba(255,255,255,0.2);
  color: white;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}
.hud-btn:hover { background: rgba(255,255,255,0.3); }

/* ============ ИГРОВОЕ ПОЛЕ ============ */
.game-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(15px, 4vw, 50px);
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.card {
  position: relative;
  border-radius: 50%;
  background: var(--card-bg);
  border: 4px solid var(--card-border);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow var(--transition);
  width: min(42vw, 380px);
  height: min(42vw, 380px);
}
.card.hexagon {
  border-radius: 0;
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  border: none;
  box-shadow: none;
}
.card.hexagon::before {
  content: '';
  position: absolute;
  inset: -4px;
  background: var(--card-border);
  clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
  z-index: -1;
}
.card.square { border-radius: var(--radius); }
.card.spinning { animation: spin 8s linear infinite; }
.card.shake { animation: shake 0.5s ease; }
.card.entering { animation: cardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-8px); }
  80% { transform: translateX(8px); }
}
@keyframes cardEnter {
  0% { transform: scale(0.5) rotate(180deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.symbol {
  position: absolute;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease, filter 0.2s ease;
  overflow: visible;
  padding: 3px;
}
.symbol:hover { filter: brightness(1.1); z-index: 10; }
/* IMPORTANT: never overwrite .symbol transform on click — it contains the
   translate/rotation used to position the symbol on the card. */
.symbol:active { filter: brightness(0.96); }
.symbol img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: none;
  transform-origin: center;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.symbol:active img, .symbol:active .word { transform: scale(0.94); }
.symbol .word {
  font-weight: 900;
  color: var(--text);
  text-align: center;
  line-height: 1.1;
  padding: 4px 8px;
  /* Word & Picture mode: words are shown directly on the circle, without a tile/background. */
  background: transparent;
  border-radius: 0;
  white-space: nowrap;
  text-shadow: none;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: inherit;
}
.symbol.matched {
  animation: symbolMatch 0.8s ease forwards;
  z-index: 20;
}
.symbol.wrong {
  animation: symbolWrong 0.5s ease;
  filter: drop-shadow(0 0 15px var(--danger));
}
@keyframes symbolMatch {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.2) drop-shadow(0 0 25px var(--accent)); }
  100% { filter: brightness(1.08) drop-shadow(0 0 20px var(--success)); }
}
@keyframes symbolWrong {
  0%, 100% { filter: none; }
  35%, 70% { filter: drop-shadow(0 0 14px var(--danger)) brightness(0.9); }
}

/* ============ КОМБО И СООБЩЕНИЯ ============ */
.combo-popup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 900;
  color: white;
  text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}
.combo-popup.show { animation: comboPop 1.2s ease forwards; }
@keyframes comboPop {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -150%) scale(0.8); opacity: 0; }
}

/* ============ ПАНЕЛЬ УЧИТЕЛЯ ============ */
.teacher-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(30, 30, 45, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: white;
  padding: 12px;
  display: none;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  z-index: 50;
  border-top: 2px solid rgba(255,255,255,0.1);
}
.teacher-panel.show { display: flex; }
.teacher-btn {
  background: rgba(255,255,255,0.1);
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}
.teacher-btn:hover { background: rgba(255,255,255,0.2); }
.teacher-btn.success { background: var(--success); }
.teacher-btn.danger { background: var(--danger); }
.teacher-btn.warn { background: var(--accent); }

/* ============ НАСТРОЙКИ ============ */
#settingsScreen {
  flex-direction: column;
  z-index: 2;
}
.settings-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.98);
  margin: 10px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-height: calc(100vh - 20px);
}
.settings-header {
  padding: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.settings-header h2 { font-size: 1.5rem; }
.settings-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.settings-tabs {
  display: flex;
  flex-direction: column;
  background: #f3f4f6;
  min-width: 200px;
  border-right: 2px solid var(--card-border);
}
.settings-tab {
  padding: 15px 20px;
  background: none;
  color: var(--text);
  text-align: left;
  font-weight: 600;
  border-radius: 0;
  border-left: 4px solid transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
}
.settings-tab:hover { background: rgba(0,0,0,0.03); }
.settings-tab.active {
  background: white;
  border-left-color: var(--primary);
  color: var(--primary);
}
.settings-content {
  flex: 1;
  overflow-y: auto;
  padding: 25px;
}
.settings-section { display: none; }
.settings-section.active { display: block; }
.settings-section h3 {
  font-size: 1.3rem;
  margin-bottom: 20px;
  color: var(--primary-dark);
  border-bottom: 2px solid var(--card-border);
  padding-bottom: 10px;
}
.settings-field {
  margin-bottom: 18px;
}
.settings-field label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text);
  font-size: 0.95rem;
}
.settings-field input,
.settings-field select,
.settings-field textarea { width: 100%; }
.settings-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: #f9fafb;
  border-radius: 10px;
}
.checkbox-row input[type="checkbox"] { width: 20px; height: 20px; }
.color-picker-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.color-picker-row input[type="color"] {
  width: 50px; height: 40px;
  padding: 2px;
  border: 2px solid var(--card-border);
}

/* ============ ГАЛЕРЕЯ ИЗОБРАЖЕНИЙ ============ */
.gallery-upload {
  border: 3px dashed var(--card-border);
  border-radius: 15px;
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  margin-bottom: 20px;
  background: #f9fafb;
}
.gallery-upload:hover, .gallery-upload.dragover {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.05);
}
.gallery-upload .icon { font-size: 3rem; margin-bottom: 10px; }
.gallery-upload p { color: var(--text-light); font-weight: 500; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
}
.gallery-item {
  background: white;
  border: 2px solid var(--card-border);
  border-radius: 12px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}
.gallery-item img {
  width: 100%;
  height: 90px;
  object-fit: contain;
  background: #f3f4f6;
  border-radius: 8px;
}
.gallery-item input {
  font-size: 0.8rem;
  padding: 6px 8px;
}
.gallery-item .actions {
  display: flex;
  gap: 4px;
}
.gallery-item .actions button {
  flex: 1;
  padding: 5px;
  font-size: 0.75rem;
  min-height: 30px;
  border-radius: 6px;
}
.gallery-item .del-btn { background: var(--danger); color: white; }
.gallery-item .rep-btn { background: var(--primary); color: white; }
.gallery-count {
  display: inline-block;
  padding: 5px 12px;
  background: var(--primary);
  color: white;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 10px;
}

/* ============ ТЕМЫ ============ */
.themes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 10px;
}
.theme-card {
  padding: 15px;
  border: 3px solid var(--card-border);
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  background: white;
}
.theme-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow); }
.theme-card.active { border-color: var(--primary); background: rgba(99,102,241,0.05); }
.theme-preview {
  width: 100%;
  height: 70px;
  border-radius: 8px;
  margin-bottom: 8px;
}

/* ============ РЕЖИМЫ ИГРЫ ============ */
.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}
.mode-card {
  padding: 20px;
  background: white;
  border: 3px solid var(--card-border);
  border-radius: 15px;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.mode-card:hover {
  border-color: var(--primary);
  transform: translateY(-3px);
  box-shadow: var(--card-shadow);
}
.mode-card.active { border-color: var(--primary); background: rgba(99,102,241,0.05); }
.mode-card .icon { font-size: 2.5rem; margin-bottom: 10px; }
.mode-card h4 { margin-bottom: 5px; color: var(--primary-dark); }
.mode-card p { font-size: 0.85rem; color: var(--text-light); }

/* ============ КНОПКИ НАСТРОЕК ============ */
.settings-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 25px;
  background: #f9fafb;
  border-top: 2px solid var(--card-border);
}
.action-btn {
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 700;
  color: white;
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-btn.save { background: var(--success); }
.action-btn.export { background: var(--primary); }
.action-btn.import { background: var(--accent); }
.action-btn.reset { background: var(--danger); }
.action-btn.back { background: #6b7280; }
.action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

/* ============ ЭКРАН РЕЗУЛЬТАТОВ ============ */
#resultScreen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 20px;
  z-index: 2;
}
.result-card {
  background: white;
  border-radius: 25px;
  padding: 40px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 500px;
  width: 100%;
  animation: cardEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.result-prize { font-size: 5rem; margin-bottom: 15px; animation: bounce 1s ease infinite; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.result-prize img { width: 120px; height: 120px; object-fit: contain; }
.result-title { font-size: 2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 5px; }
.result-message { font-size: 1.1rem; color: var(--text-light); margin-bottom: 25px; font-weight: 500; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 12px;
  margin-bottom: 25px;
}
.stat-box {
  background: #f9fafb;
  padding: 15px;
  border-radius: 12px;
}
.stat-value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-light);
  font-weight: 600;
  text-transform: uppercase;
}
.result-buttons { display: flex; flex-direction: column; gap: 10px; }
.result-buttons button {
  padding: 14px 25px;
  border-radius: 12px;
  font-weight: 700;
  color: white;
}
.btn-play { background: var(--success); }
.btn-menu { background: var(--primary); }
.btn-download { background: var(--accent); }

/* ============ МОДАЛЬНЫЕ ОКНА ============ */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  backdrop-filter: blur(5px);
}
.modal.show { display: flex; }
.modal-content {
  background: white;
  border-radius: 20px;
  padding: 30px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: cardEnter 0.4s ease;
}
.modal-content h2 { color: var(--primary-dark); margin-bottom: 15px; }
.modal-content p { margin-bottom: 15px; line-height: 1.6; }
.modal-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.modal-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  font-weight: 700;
  color: white;
  min-width: 120px;
}
.btn-confirm { background: var(--success); }
.btn-cancel { background: #6b7280; }

/* ============ УВЕДОМЛЕНИЯ ============ */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: rgba(30, 30, 45, 0.95);
  color: white;
  padding: 12px 24px;
  border-radius: 30px;
  font-weight: 600;
  z-index: 300;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 90vw;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* ============ КОНФЕТТИ ============ */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 250;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ============ СВЕТЯЩАЯСЯ ЛИНИЯ ============ */
.match-line {
  position: absolute;
  height: 4px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--success), transparent);
  box-shadow: 0 0 20px var(--accent), 0 0 40px var(--success);
  pointer-events: none;
  z-index: 30;
  animation: lineFlash 0.8s ease forwards;
  transform-origin: left center;
}
@keyframes lineFlash {
  0% { opacity: 0; transform: scaleX(0); }
  50% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}

/* ============ АДАПТИВНОСТЬ ============ */
@media (max-width: 768px) {
  .settings-body { flex-direction: column; }
  .settings-tabs {
    flex-direction: row;
    overflow-x: auto;
    min-width: auto;
    border-right: none;
    border-bottom: 2px solid var(--card-border);
  }
  .settings-tab {
    border-left: none;
    border-bottom: 4px solid transparent;
    white-space: nowrap;
    min-width: max-content;
  }
  .settings-tab.active { border-bottom-color: var(--primary); }
  .card {
    width: min(44vw, 280px);
    height: min(44vw, 280px);
  }
  .game-area { gap: 10px; padding: 10px; }
  .game-hud { padding: 10px; font-size: 0.9rem; }
  .hud-item { padding: 6px 10px; font-size: 0.85rem; min-width: 65px; }
  .menu-title { font-size: clamp(1.8rem, 6vw, 3rem); }
  .settings-content { padding: 15px; }
}

@media (max-width: 480px) {
  .card {
    width: 46vw;
    height: 46vw;
  }
  .game-area { flex-direction: column; gap: 15px; }
  .result-card { padding: 25px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .teacher-panel { padding: 8px; }
  .teacher-btn { font-size: 0.75rem; padding: 6px 10px; }
}

/* ============ СКРОЛЛБАРЫ ============ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #f3f4f6; }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

/* ============ СКРЫТИЕ ЭЛЕМЕНТОВ ============ */
.hidden { display: none !important; }
</style>

<div id="menuScreen" class="screen active">
  <h1 class="menu-title" id="gameTitle">Spot It!</h1>
  <p class="menu-subtitle">Vocabulary Challenge 🎯</p>
  <div class="menu-buttons">
    <button class="menu-btn primary" onclick="startGame()">
      <span class="icon">▶️</span> Start Game
    </button>
    <button class="menu-btn" onclick="showScreen('modeSelect')">
      <span class="icon">🎮</span> Game Modes
    </button>
    
    
    <button class="menu-btn" onclick="toggleFullscreen()">
      <span class="icon">⛶</span> Fullscreen
    </button>
  </div>
</div>

<!-- ========== ВЫБОР РЕЖИМА ========== -->
<div id="modeSelect" class="screen">
  <div class="settings-container">
    <div class="settings-header">
      <h2>🎮 Choose Game Mode</h2>
      <button class="hud-btn" onclick="showScreen('menuScreen')" style="background:rgba(255,255,255,0.2)">✕</button>
    </div>
    <div class="settings-content">
      <div class="mode-grid" id="modeGrid"></div>
    </div>
    <div class="settings-actions">
      <button class="action-btn back" onclick="showScreen('menuScreen')">← Back</button>
      <button class="action-btn save" onclick="startGame()" style="margin-left:auto">▶ Start with selected mode</button>
    </div>
  </div>
</div>

<!-- ========== ИГРОВОЙ ЭКРАН ========== -->
<div id="gameScreen" class="screen">
  <div class="game-hud">
    <div class="hud-item" id="hudScore"><span class="icon">⭐</span><span id="scoreValue">10</span></div>
    <div class="hud-item team-score team-left" id="hudTeam1"><span class="icon">🔵</span><span id="team1NameHud">Team 1</span>: <span id="team1Score">1</span></div>
    <div class="hud-item team-score team-right" id="hudTeam2"><span class="icon">🔴</span><span id="team2NameHud">Team 2</span>: <span id="team2Score">0</span></div>
    <div class="hud-item streak" id="hudStreak"><span class="icon">🔥</span><span id="streakValue">1</span></div>
    <div class="hud-item lives hidden" id="hudLives"><span class="icon">❤️</span><span id="livesValue">3</span></div>
    <div class="hud-item hidden" id="hudTime"><span class="icon">⏱️</span><span id="timeValue">60</span></div>
    
    <button class="hud-btn" onclick="pauseGame()" title="Pause">⏸️</button>
    <button class="hud-btn" onclick="exitGame()" title="Exit">🏠</button>
  </div>
  <div class="game-area" id="gameArea">
    <div class="card" id="card1" style="background: rgb(255, 255, 255); border-color: rgb(229, 231, 235); border-width: 4px; box-shadow: rgba(0, 0, 0, 0.15) 0px 20px 60px;"></div>
    <div class="card" id="card2" style="background: rgb(255, 255, 255); border-color: rgb(229, 231, 235); border-width: 4px; box-shadow: rgba(0, 0, 0, 0.15) 0px 20px 60px;"></div>
  </div>
  
</div>

<!-- ========== НАСТРОЙКИ ========== -->


<!-- ========== ЭКРАН РЕЗУЛЬТАТОВ ========== -->
<div id="resultScreen" class="screen">
  <div class="result-card">
    <div class="result-prize" id="resultPrize">🏆</div>
    <h2 class="result-title" id="resultTitle">Game Over!</h2>
    <p class="result-message" id="resultMessage">Great job!</p>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="result-buttons">
      <button class="btn-play" onclick="startGame()">🔄 Play Again</button>
      <button class="btn-menu" onclick="showScreen('menuScreen')">🏠 Main Menu</button>
      <button class="btn-download" onclick="downloadResult()">💾 Download Result</button>
    </div>
  </div>
</div>

<!-- ========== МОДАЛЬНЫЕ ОКНА ========== -->




<div class="modal" id="confirmModal">
  <div class="modal-content">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMessage"></p>
    <div class="modal-buttons">
      <button class="btn-confirm" id="confirmYes">Yes</button>
      <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="pauseModal">
  <div class="modal-content" style="text-align:center">
    <h2>⏸️ Game Paused</h2>
    <p>Take a break!</p>
    <div class="modal-buttons" style="flex-direction:column">
      <button class="btn-confirm" onclick="resumeGame()">▶ Resume</button>
      <button class="btn-cancel" onclick="exitGame()">🏠 Exit to Menu</button>
    </div>
  </div>
</div>

/* ============================================================
   АУДИО СИСТЕМА (Web Audio API)
   ============================================================ */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
  }
}

function playTone(freq, duration = 0.15, type = "sine", vol = 0.3) {
  if (!config.sound || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol * config.volume / 100, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playMatchSound() {
  playTone(523, 0.1);
  setTimeout(() => playTone(659, 0.1), 80);
  setTimeout(() => playTone(784, 0.15), 160);
}

function playErrorSound() {
  playTone(200, 0.15, "sawtooth", 0.2);
  setTimeout(() => playTone(150, 0.2, "sawtooth", 0.2), 100);
}

function playClickSound() {
  playTone(800, 0.05, "sine", 0.15);
}

function playComboSound() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.15), i * 80));
}

function playGameOverSound() {
  [440, 349, 294, 220].forEach((f, i) => setTimeout(() => playTone(f, 0.2, "triangle", 0.25), i * 150));
}

function playWinSound() {

}

/* ============================================================
   АЛГОРИТМ DOBBLE (проективная плоскость)
   Гарантирует, что любые две карты имеют ровно одно совпадение.
   Порядок p (простое число) => p²+p+1 карт, p+1 символов на карте
   ============================================================ */

function generateDobbleDeck(p) {
  // p должно быть простым (2, 3, 5, 7, 11)
  const cards = [];
  const n = p * p + p + 1;
  
  // Первая карта: символы 0..p
  cards.push(Array.from({length: p + 1}, (_, i) => i));
  
  // p карт с символом 0
  for (let i = 0; i < p; i++) {
    const card = [0];
    for (let j = 0; j < p; j++) {
      card.push(p + 1 + i * p + j);
    }
    cards.push(card);
  }
  
  // p*p оставшихся карт
  for (let i = 0; i < p; i++) {
    for (let j = 0; j < p; j++) {
      const card = [i + 1];
      for (let k = 0; k < p; k++) {
        card.push(p + 1 + k * p + ((i * k + j) % p));
      }
      cards.push(card);
    }
  }
  
  return cards;
}

function getPrimeForSymbols(n) {
  // Находит простое число p, такое что p+1 >= n
  const primes = [2, 3, 5, 7, 11, 13];
  for (const p of primes) {
    if (p + 1 >= n) return p;
  }
  return 7;
}

/* ============================================================
   РАЗМЕЩЕНИЕ СИМВОЛОВ НА КАРТЕ
   Расставляет символы по кругу с разными размерами и углами
   ============================================================ */

function placeSymbols(count, cardSize) {
  /*
    Large-safe layout.
    Instead of random rectangles that can overlap, use stable slots designed
    for 4 / 6 / 8 symbols. The visible image and clickable box are identical.
  */
  if (count <= 0) return [];

  const templates = {
    4: [
      {x:50,y:50,size:34},
      {x:50,y:19,size:28},
      {x:77,y:67,size:28},
      {x:23,y:67,size:28}
    ],
    6: [
      {x:50,y:50,size:30},
      {x:50,y:19,size:25},
      {x:79,y:40,size:25},
      {x:68,y:75,size:25},
      {x:32,y:75,size:25},
      {x:21,y:40,size:25}
    ],
    8: [
      {x:50,y:50,size:25},
      {x:50,y:18,size:22},
      {x:75,y:30,size:22},
      {x:81,y:58,size:22},
      {x:64,y:79,size:22},
      {x:36,y:79,size:22},
      {x:19,y:58,size:22},
      {x:25,y:30,size:22}
    ]
  };

  let slots = templates[count];
  if (!slots) {
    // Generic non-overlapping ring fallback.
    const ringCount = Math.max(1, count - 1);
    const ringSize = Math.max(18, Math.min(26, 62 / Math.sqrt(count)));
    slots = [{x:50,y:50,size:Math.min(29, ringSize + 4)}];
    for (let i = 0; i < ringCount; i++) {
      const a = -Math.PI/2 + i * Math.PI * 2 / ringCount;
      slots.push({
        x: 50 + Math.cos(a) * 31,
        y: 50 + Math.sin(a) * 31,
        size: ringSize
      });
    }
    slots = slots.slice(0, count);
  }

  // Let settings make the whole layout a little smaller/larger, but keep it
  // inside a safe range so hit boxes never overlap.
  const requestedMid = ((Number(config.minSize) || 24) + (Number(config.maxSize) || 32)) / 2;
  const baseMid = count >= 8 ? 22 : count >= 6 ? 26 : 30;
  const scale = Math.max(0.9, Math.min(1.12, requestedMid / baseMid));

  return slots.map(slot => ({
    x: slot.x,
    y: slot.y,
    size: slot.size * scale,
    rot: randRotation()
  })).sort(() => Math.random() - 0.5);
}

function rand(min, max) { return Math.random() * (max - min) + min; }
function randRotation() {
  if (!config.rotate) return 0;
  const max = config.maxRotation;
  switch(config.difficulty) {
    case "easy": return rand(-max/3, max/3);
    case "medium": return rand(-max*2/3, max*2/3);
    case "hard": return rand(-max, max);
    default: return rand(-max/2, max/2);
  }
}

/* ============================================================
   СОЗДАНИЕ КАРТ ДЛЯ ТЕКУЩЕГО РАУНДА
   ============================================================ */

function createRound() {
  const count = Number(config.symbolsPerCard) || 6;
  const required = count * 2 - 1;
  if (config.images.length < required) {
    toast(`Need at least ${required} unique images for ${count} symbols per circle.`, "error", 4500);
    return false;
  }

  // Each circle contains unique pictures. The two circles share exactly ONE picture.
  let shuffled = [...config.images].sort(() => Math.random() - 0.5);
  // Avoid showing the same matching picture in two consecutive rounds when possible.
  if (shuffled.length > 1 && state.lastMatchImageId != null) {
    const firstId = shuffled[0]?.id ?? shuffled[0]?.word ?? shuffled[0]?.dataURL ?? shuffled[0]?.emoji;
    if (firstId === state.lastMatchImageId) {
      const swapIndex = shuffled.findIndex((img, index) => {
        if (index === 0) return false;
        const id = img?.id ?? img?.word ?? img?.dataURL ?? img?.emoji;
        return id !== state.lastMatchImageId;
      });
      if (swapIndex > 0) [shuffled[0], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[0]];
    }
  }
  const selected = shuffled.slice(0, required);
  const common = selected[0];
  state.currentMatchImage = common;
  state.lastMatchImageId = common?.id ?? common?.word ?? common?.dataURL ?? common?.emoji ?? null;
  const leftOnly = selected.slice(1, count);
  const rightOnly = selected.slice(count, required);
  const leftImages = [common, ...leftOnly].sort(() => Math.random() - 0.5);
  const rightImages = [common, ...rightOnly].sort(() => Math.random() - 0.5);

  const keyFor = (img, i) => img.id || `img_${i}_${img.word || ''}`;
  const all = [...new Set([...leftImages, ...rightImages])];
  const symbolMap = {};
  all.forEach((img, i) => { symbolMap[keyFor(img, i)] = img; });
  const commonKey = Object.keys(symbolMap).find(k => symbolMap[k] === common);
  const leftKeys = leftImages.map(img => Object.keys(symbolMap).find(k => symbolMap[k] === img));
  const rightKeys = rightImages.map(img => Object.keys(symbolMap).find(k => symbolMap[k] === img));

  state.matchSymbol = commonKey;
  const isWordPic = state.mode === "wordpic";
  renderCard("card1", leftKeys, symbolMap, placeSymbols(leftKeys.length), false);
  renderCard("card2", rightKeys, symbolMap, placeSymbols(rightKeys.length), isWordPic);

  const c1 = document.getElementById("card1");
  const c2 = document.getElementById("card2");
  c1.classList.remove("spinning");
  c2.classList.remove("spinning");
  c1.classList.add("entering");
  c2.classList.add("entering");
  setTimeout(() => { c1.classList.remove("entering"); c2.classList.remove("entering"); }, 600);
  if (config.spinCard || state.mode === "reverse" || (config.reverse && Math.random() < 0.3)) {
    (Math.random() < 0.5 ? c1 : c2).classList.add("spinning");
  }
  state.roundStart = Date.now();
  return true;
}

function renderCard(cardId, symbolIndices, symbolMap, positions, useWords) {
  const card = document.getElementById(cardId);
  card.innerHTML = "";
  card.style.background = cardId === "card2" ? (config.cardColor2 || config.cardColor) : config.cardColor;
  card.style.borderColor = config.borderColor;
  card.style.borderWidth = config.borderWidth + "px";
  card.style.boxShadow = config.shadow ? "0 20px 60px rgba(0,0,0,0.15)" : "none";
  card.className = "card";
  if (config.cardShape === "square") card.classList.add("square");
  else if (config.cardShape === "hexagon") card.classList.add("hexagon");
  
  symbolIndices.forEach((symIdx, i) => {
    const img = symbolMap[symIdx];
    const pos = positions[i];
    const el = document.createElement("div");
    el.className = "symbol";
    el.dataset.symbolId = symIdx;
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.width = pos.size + "%";
    el.style.height = pos.size + "%";
    el.style.transform = `translate(-50%, -50%) rotate(${pos.rot}deg)`;
    
    if (useWords && img.word) {
      const wordEl = document.createElement("div");
      wordEl.className = "word";
      wordEl.textContent = img.word;
      wordEl.style.fontSize = Math.max(10, pos.size / 5) + "px";
      el.appendChild(wordEl);
    } else if (img.dataURL) {
      const imgEl = document.createElement("img");
      imgEl.src = img.dataURL;
      imgEl.alt = img.word || "";
      imgEl.draggable = false;
      el.appendChild(imgEl);
    } else if (img.emoji) {
      el.style.fontSize = (pos.size * 2) + "px";
      el.style.lineHeight = "1";
      el.textContent = img.emoji;
    }
    
    el.addEventListener("click", (e) => handleSymbolClick(symIdx, el, e));
    el.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleSymbolClick(symIdx, el, e);
    }, { passive: false });
    
    card.appendChild(el);
  });
}

/* ============================================================
   ОБРАБОТКА КЛИКА ПО СИМВОЛУ
   ============================================================ */

function handleSymbolClick(symIdx, element, event) {
  if (!state.playing || state.paused) return;
  
  initAudio();
  
  if (symIdx === state.matchSymbol) {
    // Правильно!
    handleCorrectMatch(element);
  } else {
    // Ошибка
    handleWrongMatch(element);
  }
}

function handleCorrectMatch(element) {
  const clickedCard = element.closest(".card");
  if (clickedCard && clickedCard.id === "card2") state.team2Score++;
  else state.team1Score++;
  const reactionTime = (Date.now() - state.roundStart) / 1000;
  state.totalTime += reactionTime;
  state.correct++;
  state.streak++;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  
  // Комбо
  let multiplier = 1;
  if (config.combo) {
    if (state.streak >= 5) { multiplier = 3; showCombo("Vocabulary Master! 🏆"); }
    else if (state.streak >= 3) { multiplier = 2; showCombo("Great streak! 🔥"); }
  }
  
  const points = config.points * multiplier;
  state.score += points;
  
  // Эффекты
  playMatchSound();
  highlightMatch();
  if (config.effects && config.confetti) spawnConfetti();
  
  // Обновляем HUD
  updateHUD();
  
  // Режим "Найди и скажи"
  
  // Следующий раунд
  setTimeout(() => {
    if (state.playing && !createRound()) {
      endGame();
    }
  }, 900);
}

function handleWrongMatch(element) {
  state.wrong++;
  state.streak = 0;
  
  playErrorSound();
  element.classList.add("wrong");
  document.getElementById("card1").classList.add("shake");
  document.getElementById("card2").classList.add("shake");
  
  setTimeout(() => {
    element.classList.remove("wrong");
    document.getElementById("card1").classList.remove("shake");
    document.getElementById("card2").classList.remove("shake");
  }, 500);
  
  // В режиме "жизни" теряем жизнь
  if (state.mode === "lives") {
    state.lives--;
    if (state.lives <= 0) {
      setTimeout(endGame, 500);
      return;
    }
  }
  
  updateHUD();
}

function highlightMatch() {
  const symId = state.matchSymbol;
  document.querySelectorAll(`.symbol[data-symbol-id="${symId}"]`).forEach(el => {
    el.classList.add("matched");
  });
  
  if (config.effects && config.lineEffect) drawMatchLine();
}

function drawMatchLine() {
  const syms = document.querySelectorAll(`.symbol[data-symbol-id="${state.matchSymbol}"]`);
  if (syms.length < 2) return;
  const r1 = syms[0].getBoundingClientRect();
  const r2 = syms[1].getBoundingClientRect();
  const area = document.getElementById("gameArea").getBoundingClientRect();
  
  const x1 = r1.left + r1.width/2 - area.left;
  const y1 = r1.top + r1.height/2 - area.top;
  const x2 = r2.left + r2.width/2 - area.left;
  const y2 = r2.top + r2.height/2 - area.top;
  
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  
  const line = document.createElement("div");
  line.className = "match-line";
  line.style.left = x1 + "px";
  line.style.top = y1 + "px";
  line.style.width = len + "px";
  line.style.transform = `rotate(${angle}deg)`;
  document.getElementById("gameArea").appendChild(line);
  setTimeout(() => line.remove(), 800);
}

function showCombo(text) {
  playComboSound();
  const popup = document.createElement("div");
  popup.className = "combo-popup";
  popup.textContent = text;
  document.getElementById("gameArea").appendChild(popup);
  requestAnimationFrame(() => popup.classList.add("show"));

}

function spawnConfetti() {
  const colors = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899"];
  for (let i = 0; i < 30; i++) {
    setTimeout(() => {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (30 + Math.random() * 40) + "vw";
      c.style.top = "-20px";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 8) + "px";
      c.style.height = c.style.width;
      c.style.animationDuration = (2 + Math.random() * 2) + "s";
      if (Math.random() > 0.5) c.style.borderRadius = "50%";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }, i * 30);
  }
}

/* ============================================================
   ИГРОВЫЕ РЕЖИМЫ
   ============================================================ */

function startGame() {
  if (!Object.hasOwn(GAME_MODES, config.mode)) config.mode = "classic";
  if (state.timer) clearInterval(state.timer);
  const requiredImages = config.symbolsPerCard * 2 - 1;
  if (config.images.length < requiredImages) {
    toast(`You need at least ${requiredImages} unique images for ${config.symbolsPerCard} symbols per circle.`, "error", 4500);
    showScreen("menuScreen");
    return;
  }
  
  initAudio();
  
  state = {
    playing: true,
    paused: false,
    score: 0,
    lives: config.lives,
    time: config.timeLimit,
    streak: 0,
    bestStreak: 0,
    correct: 0,
    wrong: 0,
    totalTime: 0,
    roundStart: 0,
    cards: null,
    matchSymbol: null,
    deck: [],
    timer: null,
    mode: config.mode,
    lastMatchTime: 0,
    team1Score: 0,
    team2Score: 0
  };
  
  // Показываем HUD элементы в зависимости от режима
  document.getElementById("hudLives").classList.toggle("hidden", state.mode !== "lives");
  document.getElementById("hudTime").classList.toggle("hidden", state.mode !== "timed");
  document.getElementById("hudStreak").classList.toggle("hidden", !config.combo);
  
  showScreen("gameScreen");
  updateHUD();
  
  if (!createRound()) {
    endGame();
    return;
  }
  
  // Таймер для режима "timed"
  if (state.mode === "timed") {
    state.timer = setInterval(() => {
      if (state.paused) return;
      state.time--;
      document.getElementById("timeValue").textContent = state.time;
      if (state.time <= 10) document.getElementById("hudTime").style.background = "rgba(239, 68, 68, 0.4)";
      if (state.time <= 0) endGame();
    }, 1000);
  }
}

function pauseGame() {
  if (!state.playing) return;
  state.paused = true;
  openModal("pauseModal");
}

function resumeGame() {
  state.paused = false;
  closeModal("pauseModal");
}

function exitGame() {
  state.playing = false;
  state.paused = false;
  if (state.timer) clearInterval(state.timer);
  closeModal("pauseModal");
  showScreen("menuScreen");
}

function endGame() {
  state.playing = false;
  if (state.timer) clearInterval(state.timer);
  
  // Звук
  if (state.score > 50) playWinSound();
  else playGameOverSound();
  
  // Конфетти
  if (config.effects) spawnConfetti();
  setTimeout(() => { if (config.effects) spawnConfetti(); }, 500);
  
  showResults();
}

function showResults() {

  const accuracy = state.correct + state.wrong > 0

  if (state.score >= 100 && accuracy >= 90) { prize = "👑"; title = "Vocabulary Master!"; message = "Outstanding performance!"; }
  else if (state.score >= 50 && accuracy >= 75) { prize = "🥇"; title = "Excellent!"; message = "Great job!"; }
  else if (state.score >= 25) { prize = "🥈"; title = "Good job!"; message = "Nice work!"; }
  else { prize = "🎖️"; title = "Nice try!"; message = "Keep practising!"; }
  
  const prizeEl = document.getElementById("resultPrize");
  if (config.prizeImage) {
    prizeEl.innerHTML = `<img src="${config.prizeImage}" alt="prize">`;
  } else {
    prizeEl.textContent = prize;
  }
  
  document.getElementById("resultTitle").textContent = title;

  document.getElementById("statsGrid").innerHTML = `

    <div class="stat-box"><div class="stat-value">${state.correct}</div><div class="stat-label">Correct</div></div>
    <div class="stat-box"><div class="stat-value">${state.wrong}</div><div class="stat-label">Errors</div></div>
    <div class="stat-box"><div class="stat-value">${state.bestStreak}</div><div class="stat-label">Best Streak</div></div>
    <div class="stat-box"><div class="stat-value">${avgTime}s</div><div class="stat-label">Avg Time</div></div>
    <div class="stat-box"><div class="stat-value">${accuracy}%</div><div class="stat-label">Accuracy</div></div>
  `;
}

function downloadResult() {

    ? Math.round(state.correct / (state.correct + state.wrong) * 100) : 0;
  const avgTime = state.correct > 0 ? (state.totalTime / state.correct).toFixed(2) : "0";

/* ============================================================

   ============================================================ */

function init() {
  config = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...JSON.parse(JSON.stringify(EMBEDDED_CONFIG)) };
  if (!Object.hasOwn(GAME_MODES, config.mode)) config.mode = "classic";
  config.reverse = false;
  document.getElementById("gameTitle").textContent = config.title;
  applyDesign();
  showScreen("menuScreen");
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());
  document.addEventListener("click", initAudio, { once: true });
  document.addEventListener("touchstart", initAudio, { once: true });
}

// Запуск
init();
